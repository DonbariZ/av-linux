version: 2.1

jobs:
  smoke-test-gate:
    docker:
      - image: mcr.microsoft.com/playwright:v1.43.0
    steps:
      - checkout
      - run:
          name: Install Dependencies
          command: npm ci
      - run:
          name: Run Smoke Test of Sanctuary Gate
          command: npx playwright test tests/smoke.spec.ts --reporter=junit
      - store_artifacts:
          path: test-results/
          destination: smoke-gate-results
      - store_test_results:
          path: test-results/

workflows:
  version: 2
  sanctuary-check:
    jobs:
      - smoke-test-gate
