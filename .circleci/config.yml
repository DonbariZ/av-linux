version: 2.1

jobs:
  smoke-test-gate:
    docker:
      - image: mcr.microsoft.com/playwright:v1.43.0
    steps:
      - checkout
      - run: npm ci
      - run:
          name: Run Playwright Tests Across Browsers
          command: |
            npx playwright test --project=chromium
            npx playwright test --project=firefox
            npx playwright test --project=webkit
      - store_artifacts:
          path: test-results/
          destination: smoke-gate-results
      - store_test_results:
          path: test-results/

workflows:
  version: 2
  sanctuary-check:
    jobs:
      - smoke-test-gate